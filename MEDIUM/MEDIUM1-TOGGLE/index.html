<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 01 - Toggle Teks</title>
</head>
<body>

  <h2>Soal 01: Toggle Teks</h2>

  <p id="teksToggle">Ini teks yang bisa disembunyikan.</p>
  <button id="tombolToggle">Sembunyikan</button>

  <script>
    let tombol = document.getElementById("tombolToggle");
    let status = document.getElementById("teksToggle");
    function toggle() {
        if (status.innerText === "") {
            status.innerText = "Ini teks yang bisa disembunyikan.";
            tombol.innerText = "Sembunyikan";
        } else {
            status.innerText = "";
            tombol.innerText = "Tampilkan";
        }
    }
    tombol.addEventListener("click", toggle);
  </script>
</body>
</html>
