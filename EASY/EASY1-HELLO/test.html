<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing E1</title>
</head>
<body>
    <button id="tombolHello">Tampilkan Pesan</button>
    <p id="pesanTeks"></p>
    <script>
        let tombol = document.getElementById("tombolHello");
         let paragraf = document.getElementById("pesanTeks");
        function tampilkanPesan() {
            paragraf.innerHTML = "Hello, World";
        }
        tombol.addEventListener("click", tampilkanPesan);
    </script>
</body>
</html>
